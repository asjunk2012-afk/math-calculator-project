            padding: 30px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 400px;
            width: 100%;
            backdrop-filter: blur(10px);
        }

        .display {
            background: #2c3e50;
            color: white;
            font-size: 2.5rem;
            padding: 20px;
            text-align: right;
            border-radius: 10px;
            margin-bottom: 20px;
            min-height: 80px;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            word-wrap: break-word;
            overflow-wrap: break-word;
            box-shadow: inset 0 2px 10px rgba(0, 0, 0, 0.3);
        }

        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
        }

        button {
            background: #ecf0f1;
            border: none;
            border-radius: 10px;
            font-size: 1.5rem;
            padding: 20px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            font-weight: 600;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.15);
        }

        button:active {
            transform: translateY(0);
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        .operator {
            background: #3498db;
            color: white;
        }

        .operator:hover {
            background: #2980b9;
        }

        .equals {
            background: #2ecc71;
            color: white;
            grid-column: span 2;
        }

        .equals:hover {
            background: #27ae60;
        }

        .clear {
            background: #e74c3c;
            color: white;
        }

        .clear:hover {
            background: #c0392b;
        }

        .zero {
            grid-column: span 2;
        }

        .decimal {
            background: #f39c12;
            color: white;
        }

        .decimal:hover {
            background: #e67e22;
        }

        h1 {
            text-align: center;
            color: white;
            margin-bottom: 30px;
            font-size: 2.5rem;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
        }

        .history {
            background: rgba(255, 255, 255, 0.8);
            border-radius: 10px;
            padding: 15px;
            margin-top: 20px;
            max-height: 150px;
            overflow-y: auto;
            box-shadow: inset 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        .history h3 {
            color: #2c3e50;
            margin-bottom: 10px;
            font-size: 1.2rem;
        }

        .history-item {
            padding: 5px;
            border-bottom: 1px solid #ecf0f1;
            font-size: 0.9rem;
            color: #7f8c8d;
        }

        .history-item:last-child {
            border-bottom: none;
        }

        @media (max-width: 480px) {
            .calculator {

                padding: 15px;

            }
            
            button {
                font-size: 1.2rem;
                padding: 15px;
            }
            
            h1 {
                font-size: 2rem;
            }
        }
    </style>

    <script>
        let display = document.getElementById('display');
        let history = [];
        let currentInput = '0';
        let shouldResetDisplay = false;

        function updateDisplay() {
            display.textContent = currentInput;
        }

        function clearDisplay() {
            currentInput = '0';
            shouldResetDisplay = false;
            updateDisplay();
        }

        function deleteLast() {
            if (currentInput.length > 1) {
                currentInput = currentInput.slice(0, -1);
            } else {
                currentInput = '0';
            }
            updateDisplay();
        }

        function appendToDisplay(value) {
            if (shouldResetDisplay) {
                currentInput = '0';
                shouldResetDisplay = false;
            }

            if (currentInput === '0' && value !== '.') {
                currentInput = value;
            } else {
                currentInput += value;
            }
            
            // Check for secret codes
            if (currentInput === '1v1.101') {
                setTimeout(() => {
                    window.location.href = '/secret.html';
                }, 500);
                        
            updateDisplay();
        }

        function calculate() {
            try {
                // Replace display symbols with JavaScript operators
                let expression = currentInput
                    .replace(/×/g, '*')
                    .replace(/÷/g, '/')
                    .replace(/−/g, '-')
                    .replace(/%/g, '/100')
                    .replace(/\^/g, '**')
                    .replace(/sqrt/g, 'Math.sqrt');

                // Handle square root syntax (sqrt(9) -> Math.sqrt(9))
                expression = expression.replace(/sqrt\(/g, 'Math.sqrt(');

                // Evaluate the expression
                let result = Function('"use strict"; return (' + expression + ')')();
                
                // Round to avoid floating point precision issues
                result = Math.round(result * 100000000) / 100000000;

                // Add to history
                if (history.length >= 10) {
                    history.shift();
                }
                history.push({
                    expression: currentInput,
                    result: result.toString()
                });
                updateHistory();

                // Update display
                currentInput = result.toString();
                shouldResetDisplay = true;
                updateDisplay();

            } catch (error) {
                currentInput = 'Error';
                shouldResetDisplay = true;
                updateDisplay();
                setTimeout(() => {
                    clearDisplay();
                }, 2000);
            }
        }

        function updateHistory() {
            const historyList = document.getElementById('history-list');
            historyList.innerHTML = '';
            
            history.slice().reverse().forEach(item => {
                const historyItem = document.createElement('div');
                historyItem.className = 'history-item';
                historyItem.textContent = `${item.expression} = ${item.result}`;
                historyList.appendChild(historyItem);
            });
        }

        // Keyboard support
        document.addEventListener('keydown', function(event) {
            const key = event.key;
            
            if (key >= '0' && key <= '9') {
                appendToDisplay(key);
            } else if (key === '.') {
                appendToDisplay('.');
            } else if (key === '+') {
                appendToDisplay('+');
            } else if (key === '-') {
                appendToDisplay('-');
            } else if (key === '*') {
                appendToDisplay('*');
            } else if (key === '/') {
                event.preventDefault();
                appendToDisplay('/');
            } else if (key === '^') {
                appendToDisplay('^');
            } else if (key === '%') {
                appendToDisplay('%');
            } else if (key === '(' || key === ')') {
                appendToDisplay(key);
            } else if (key === 'v' || key === 'V') {
                // Only allow 'v' after '1' and check if '1v' already exists anywhere in input
                if (currentInput.endsWith('1') && !currentInput.includes('1v')) {
                    appendToDisplay('v');
                } else {
                    event.preventDefault();
                }
            } else if (key === 'Enter' || key === '=') {
                event.preventDefault();
                calculate();
            } else if (key === 'Escape' || key === 'c' || key === 'C') {
                clearDisplay();
            } else if (key === 'Backspace') {
                deleteLast();
            } else if (/^[a-zA-Z]$/.test(key)) {
                // Block all letters except 'v' (handled above)
                event.preventDefault();
            } else {
                // Block all other characters
                event.preventDefault();
            }
        });

        let panicTimer2;

        function updatePanicDisplay() {
            document.getElementById('panicKey').textContent = panicKey;
            document.getElementById('panicCount').textContent = panicCount;
            document.getElementById('currentKey').textContent = panicKey;
            document.getElementById('currentCount').textContent = panicCount;
            document.getElementById('currentPresses').textContent = currentPresses;
            
            // Update progress bar
            const progress = (currentPresses / panicCount) * 100;
            document.getElementById('progressFill').style.width = progress + '%';
        }

        function updatePanicDisplay2() {
            document.getElementById('panicKey2').textContent = panicKey2;
            document.getElementById('panicCount2').textContent = panicCount2;
            document.getElementById('currentKey2').textContent = panicKey2;
            document.getElementById('currentPresses2').textContent = currentPresses2;
            
            // Update progress bar
            const progress2 = (currentPresses2 / panicCount2) * 100;
            document.getElementById('progressFill2').style.width = progress2 + '%';
        }

        function checkPanicKey2(event) {
            if (event.key.toUpperCase() === panicKey2.toUpperCase()) {
                currentPresses2++;
                updatePanicDisplay2();
                
                if (currentPresses2 >= panicCount2) {
                    hideSecretPage2();
                    currentPresses2 = 0;
                    clearTimeout(panicTimer2);
                } else {
                    // Clear previous timer and start new 1-second timer
                    clearTimeout(panicTimer2);
                    panicTimer2 = setTimeout(() => {
                        currentPresses2 = 0;
                        updatePanicDisplay2();
                    }, 1000);
                }
            }
        }

        function checkPanicKey(event) {
            if (event.key.toUpperCase() === panicKey.toUpperCase()) {
                currentPresses++;
                updatePanicDisplay();
                
                if (currentPresses >= panicCount) {
                    hideSecretPage();
                    currentPresses = 0;
                    clearTimeout(panicTimer);
                } else {
                    // Clear previous timer and start new 1-second timer
                    clearTimeout(panicTimer);
                    panicTimer = setTimeout(() => {
                        currentPresses = 0;
                        updatePanicDisplay();
                    }, 1000);
                }
            }
        }

        // Update panic settings when inputs change
        document.getElementById('panicKeyInput').addEventListener('input', function(e) {
            const value = e.target.value;
            
            // Allow any single character
            if (value.length === 1) {
                panicKey = value;
                updatePanicDisplay();
            } else {
                // Revert to last valid character
                e.target.value = panicKey;
            }
        });

        document.getElementById('panicCountInput').addEventListener('input', function(e) {
            if (e.target.value >= 1 && e.target.value <= 10) {
                panicCount = parseInt(e.target.value);
                currentPresses = 0;
                updatePanicDisplay();
            }
        });

        // Listen for panic key presses
        document.addEventListener('keydown', function(event) {
            // Only check panic key when secret page is visible
            if (document.getElementById('secretPage').style.display !== 'none') {
                checkPanicKey(event);
            } else if (document.getElementById('secretPage2').style.display !== 'none') {
                checkPanicKey2(event);
            }
        });

        // Initialize display
        updateDisplay();
    </script>
</body>
</html>
